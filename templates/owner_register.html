{% extends "base.html" %}

{% block title %}Owner Registration - Home Rental{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 480px; margin: 3rem auto;">
  <div class="auth-card" style="border-top: 4px solid var(--primary);">
    <!-- Dedicated Owner Header -->
    <div class="auth-header">
      <div style="width: 68px; height: 68px; margin: 0 auto 1rem; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem;">
        <i class="fa-solid fa-house-chimney-user"></i>
      </div>
      <h2 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main);">Create Owner Account</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.35rem;">
        Register to list your homes, manage room rentals, and receive tenant enquiries
      </p>
    </div>

    <!-- Owner Registration Form -->
    <form action="{{ url_for('owner_register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="role" value="owner">

      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <div style="position:relative;">
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-control" 
            placeholder="Ramesh Sharma" 
            value="{{ name or '' }}" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-regular fa-user" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Homeowner Email Address</label>
        <div style="position:relative;">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="owner@example.com" 
            value="{{ email or '' }}" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-regular fa-envelope" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <div style="position:relative;">
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            class="form-control" 
            placeholder="+91 98765 43210" 
            value="{{ phone or '' }}" 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-phone" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min 6 characters)</label>
        <div style="position:relative;">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-lock" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <div style="position:relative;">
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-shield-halved" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem; font-weight:700;">
        <i class="fa-solid fa-house-medical"></i> Register as Owner
      </button>
    </form>

    <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      <p style="font-size: 0.92rem; color: var(--text-muted);">
        Already have an Owner account? <a href="{{ url_for('owner_login') }}" style="font-weight: 700; color: var(--primary);">Sign In as Owner &rarr;</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
