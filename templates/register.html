{% extends "base.html" %}

{% block title %}Tenant Registration - Home Rental{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 480px; margin: 3.5rem auto;">
  <div class="auth-card">
    <!-- Clean Header -->
    <div class="auth-header">
      <div style="width: 68px; height: 68px; margin: 0 auto 1rem; border-radius: 50%; background: var(--brand-orange-light); color: var(--brand-orange); display: flex; align-items: center; justify-content: center; font-size: 2rem;">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h2 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main);">Create Tenant Account</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.35rem;">
        Sign up to search homes, save favourites, and send rental enquiries
      </p>
    </div>

    <!-- Registration Form (Tenant Only) -->
    <form action="{{ url_for('register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="role" value="customer">

      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <div style="position:relative;">
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-control" 
            placeholder="John Doe" 
            value="{{ name or '' }}" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-regular fa-user" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Gmail / Email Address</label>
        <div style="position:relative;">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="yourname@gmail.com" 
            value="{{ email or '' }}" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-regular fa-envelope" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <div style="position:relative;">
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            class="form-control" 
            placeholder="+91 98765 43210" 
            value="{{ phone or '' }}" 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-phone" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min 6 characters)</label>
        <div style="position:relative;">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-lock" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <div style="position:relative;">
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-shield-halved" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-orange btn-block btn-lg" style="margin-top: 1.5rem; font-weight:700;">
        <i class="fa-solid fa-user-plus"></i> Register as Tenant
      </button>
    </form>

    <div style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      <p style="font-size: 0.92rem; color: var(--text-muted);">
        Already have a Tenant account? 
        <a href="{{ url_for('login') }}" style="font-weight: 700; color: var(--brand-orange);">Tenant Log In &rarr;</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
