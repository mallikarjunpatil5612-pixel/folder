{% extends "base.html" %}

{% block title %}Page Not Found (404) - Home Rental{% endblock %}

{% block content %}
<div class="container" style="text-align:center; padding: 5rem 1.5rem;">
  <div style="font-size: 4rem; color: var(--brand-orange); margin-bottom: 1rem;">
    <i class="fa-solid fa-house-chimney-crack"></i>
  </div>
  <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.75rem;">
    404 - Page Not Found
  </h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 500px; margin: 0 auto 2rem;">
    The property listing or page you were searching for does not exist or has been relocated.
  </p>
  <div style="display:flex; gap:1rem; justify-content:center;">
    <a href="{{ url_for('home') }}" class="btn btn-primary">Return Home</a>
    <a href="{{ url_for('properties_listing') }}" class="btn btn-outline-primary">Browse Properties</a>
  </div>
</div>
{% endblock %}
