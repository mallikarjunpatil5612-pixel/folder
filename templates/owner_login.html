{% extends "base.html" %}

{% block title %}Owner Login - Home Rental{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 460px; margin: 3.5rem auto;">
  <div class="auth-card" style="border-top: 4px solid var(--primary);">
    <!-- Dedicated Owner Header -->
    <div class="auth-header">
      <div style="width: 68px; height: 68px; margin: 0 auto 1rem; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem;">
        <i class="fa-solid fa-house-user"></i>
      </div>
      <h2 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main);">Owner Sign In</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.35rem;">
        List homes, upload photographs, manage rooms, and view enquiries
      </p>
    </div>

    <!-- Owner Login Form -->
    <form action="{{ url_for('owner_login', next=request.args.get('next')) }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="role_filter" value="owner">

      <div class="form-group">
        <label class="form-label" for="email">Homeowner Email</label>
        <div style="position:relative;">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="owner@example.com" 
            value="{{ email or '' }}" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-regular fa-envelope" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-lock" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem; font-weight: 700;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In as Owner
      </button>
    </form>

    <!-- Owner Registration Link -->
    <div style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      <p style="font-size: 0.92rem; color: var(--text-muted);">
        New Homeowner?
      </p>
      <a href="{{ url_for('owner_register') }}" class="btn btn-outline-primary btn-sm" style="margin-top:0.6rem; font-weight: 600;">
        <i class="fa-solid fa-house-medical"></i> Register as a Homeowner
      </a>
    </div>
  </div>
</div>
{% endblock %}
