{% extends "base.html" %}

{% block title %}Internal Server Error (500) - Home Rental{% endblock %}

{% block content %}
<div class="container" style="text-align:center; padding: 5rem 1.5rem;">
  <div style="font-size: 4rem; color: var(--danger); margin-bottom: 1rem;">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>
  <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.75rem;">
    500 - Internal Server Error
  </h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 500px; margin: 0 auto 2rem;">
    An unexpected error occurred while processing your request. Please try again in a few moments.
  </p>
  <div style="display:flex; gap:1rem; justify-content:center;">
    <a href="{{ url_for('home') }}" class="btn btn-primary">Return Home</a>
    <a href="{{ url_for('contact') }}" class="btn btn-outline">Contact Support</a>
  </div>
</div>
{% endblock %}
