{% extends "base.html" %}

{% block title %}Administrator Registration - Home Rental{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 480px; margin: 3.5rem auto;">
  <div class="auth-card" style="border-top: 4px solid var(--secondary); box-shadow: var(--shadow-lg);">
    <!-- Dedicated Admin Header -->
    <div class="auth-header">
      <div style="width: 68px; height: 68px; margin: 0 auto 1rem; border-radius: 50%; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem;">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h2 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main);">Admin Registration</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.35rem;">
        Register a new administrator account for system management
      </p>
    </div>

    <!-- Admin Registration Form -->
    <form action="{{ url_for('admin_register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label class="form-label" for="name">Admin Full Name</label>
        <div style="position:relative;">
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-control" 
            placeholder="System Admin" 
            value="{{ name or '' }}" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-regular fa-user" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Administrator Gmail / Email</label>
        <div style="position:relative;">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="admin@gmail.com" 
            value="{{ email or '' }}" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-regular fa-envelope" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number (optional)</label>
        <div style="position:relative;">
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            class="form-control" 
            placeholder="+91 99999 88888" 
            value="{{ phone or '' }}" 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-phone" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min 6 characters)</label>
        <div style="position:relative;">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-lock" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <div style="position:relative;">
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            style="padding-left: 2.5rem;"
          >
          <i class="fa-solid fa-shield-halved" style="position:absolute; left:0.9rem; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="background-color: var(--secondary); border-color: var(--secondary); margin-top: 1.5rem; font-weight: 700;">
        <i class="fa-solid fa-user-shield"></i> Register Administrator
      </button>
    </form>

    <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      <p style="font-size: 0.92rem; color: var(--text-muted); margin-bottom: 0.35rem;">
        Already have an Admin account?
      </p>
      <a href="{{ url_for('admin_login') }}" style="font-weight: 700; color: var(--secondary); font-size: 0.95rem; display: inline-block;">
        Sign In Here &rarr;
      </a>
    </div>
  </div>
</div>
{% endblock %}
